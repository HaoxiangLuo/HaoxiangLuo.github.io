name: Update daily news

on:
  schedule:
    # 01:00, 05:00 and 11:00 UTC = 09:00, 13:00 and 19:00 Asia/Shanghai.
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/fetch_daily_news.py"
      - ".github/workflows/daily-news.yml"

permissions:
  contents: write
  models: read

concurrency:
  # Three runs a day is plenty; never cancel one that is mid-push.
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect world headlines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Models was retired on 2026-07-30, so the configured
          # OpenAI-compatible provider is used when one exists; otherwise the
          # unauthenticated endpoint below stays the only source.
          TRANSLATE_BASE_URL: ${{ vars.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          git pull --ff-only origin master
          python scripts/fetch_daily_news.py

      - name: Save the daily archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATE_BASE_URL: ${{ vars.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          # The JSONL archive is the history; the short index is generated from
          # it. Both belong to this job and nothing else is touched.
          if git diff --quiet -- _data/daily_news.json assets/data/archive/daily-news assets/data/archive/manifest.json; then
            echo "No news changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/daily_news.json assets/data/archive/daily-news assets/data/archive/manifest.json
          git commit -m "Update daily news $(TZ=Asia/Shanghai date +%F)"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another site update; refreshing archive (attempt $attempt)."
            git pull --rebase -X theirs origin master
            python scripts/fetch_daily_news.py
            git add _data/daily_news.json assets/data/archive/daily-news assets/data/archive/manifest.json
            git commit --amend --no-edit
          done
          echo "Unable to save the news archive after three attempts." >&2
          exit 1
