name: Update academic frontiers

on:
  schedule:
    # 01:23 UTC on Mondays = 09:23 Asia/Shanghai, once a week. The journals
    # publish far more slowly than the news cycle, so weekly is enough.
    - cron: "23 1 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/fetch_academic_frontiers.py"
      - "_data/academic_frontiers_sources.yml"
      - ".github/workflows/academic-frontiers.yml"

permissions:
  contents: write

concurrency:
  group: academic-frontiers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the newest articles
        env:
          # The configured OpenAI-compatible provider is used when one exists;
          # otherwise the collector falls back to the same unauthenticated
          # endpoint the news and opportunities jobs use, so the Chinese title
          # and abstract are still produced.
          TRANSLATE_BASE_URL: ${{ vars.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          git pull --ff-only origin master
          python scripts/fetch_academic_frontiers.py

      - name: Save the academic archive
        env:
          # Also needed here: a push race re-runs the collector below.
          TRANSLATE_BASE_URL: ${{ vars.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: |
          # The JSONL archive is the history; the short index is generated from
          # it. Both belong to this job and nothing else is touched.
          if git diff --quiet -- _data/academic_frontiers.json assets/data/archive/academic-frontiers assets/data/archive/manifest.json; then
            echo "No academic frontier changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/academic_frontiers.json assets/data/archive/academic-frontiers assets/data/archive/manifest.json
          git commit -m "Update academic frontiers $(TZ=Asia/Shanghai date +%F)"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another site update; refreshing the archive (attempt $attempt)."
            # -X theirs keeps the newest remote news archives; this job only
            # re-collects its own data file afterwards.
            git pull --rebase -X theirs origin master
            python scripts/fetch_academic_frontiers.py
            git add _data/academic_frontiers.json assets/data/archive/academic-frontiers assets/data/archive/manifest.json
            git commit --amend --no-edit
          done
          echo "Unable to save the academic archive after three attempts." >&2
          exit 1
