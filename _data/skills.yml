- name_zh: "艾恩葛朗特"
  name_en: "Aincrad"
  category_zh: "3D 可交互游戏"
  category_en: "Interactive 3D game"
  status_zh: "持续开发中"
  status_en: "In development"
  description_zh: "以《刀剑神域》中的悬浮城市艾恩葛朗特为原型，探索将动画中的空间转化为可亲身游历的 3D 世界。玩家可以步行探索浮岛、自由飞行环绕浮城，并进入起始之镇，体验视角切换、传送与场景交互。"
  description_en: "An interactive 3D project inspired by the floating city of Aincrad in Sword Art Online. Explore an island on foot, fly around the floating castle, and enter the Town of Beginnings, with switchable viewpoints, teleportation and environmental interactions."
  features_zh:
    - "浮岛与悬浮城：步行、奔跑、跳跃和自由飞行。"
    - "场景衔接：在城外飞行、起始之镇与浮岛之间往返。"
    - "交互体验：视角切换、镜头设置、动作与环境声效。"
  features_en:
    - "Walk, run, jump and fly freely around the island and floating castle."
    - "Travel between exterior flight, the Town of Beginnings and the island."
    - "Switch viewpoints and adjust the camera, with movement and environmental audio."
  video_url: "/assets/media/aincrad-opening.mp4"
  video_poster: "/assets/media/aincrad-opening.jpg"
  video_caption_zh: "实机开场录像 · 18 秒 · 保留原声。片段展示启动演出、浮岛苏醒与望向浮城。"
  video_caption_en: "In-game opening · 18 seconds · original audio. Startup, awakening on the island and a first view of the floating castle."
- name_zh: "贾维斯"
  name_en: "Jarvis"
  image_url: "/assets/media/jarvis-bilingual-reader.png"
  image_alt_zh: "贾维斯双语阅读器，左侧显示 PDF 原文，右侧显示中文译文，可同步滚动、翻页和调整缩放。"
  image_alt_en: "Jarvis bilingual reader showing the original PDF on the left and its Chinese translation on the right, with scrolling, page and zoom controls."
  image_caption_zh: "双语阅读实机界面 · 原文在左、译文在右 · 点击查看原图"
  image_caption_en: "Bilingual reading in the app · original on the left, translation on the right · open full-size image"
  category_zh: "知识库与研究工作台"
  category_en: "Knowledge library & research workspace"
  status_zh: "个人试用版"
  status_en: "Personal prototype"
  description_zh: "围绕文献阅读、翻译与知识积累开发的本地研究工作台。可调用大语言模型翻译 PDF，尽量保留原文版式，提供原文与译文双栏对照；将阅读中的摘录、观点和页码存入知识子库，让资料整理、引用与项目写作衔接起来。"
  description_en: "A local research workspace for reading, translation and knowledge building. Connect a language model to translate PDFs while preserving their layout where possible, read the source and translation side by side, and save excerpts, ideas and page references in knowledge collections."
  features_zh:
    - "文献管理与双语阅读：PDF 导入去重、连续阅读、同步滚动、独立缩放与标注。"
    - "译文导出：双语 PDF 侧重保留版式，Word 与 Markdown 便于继续编辑；复杂表格和公式需核对。"
    - "知识积累与引用：按原文、页码保存摘录与观点，支持 AI 辅助提炼及 BibTeX、RIS、CSL-JSON 转换。"
    - "项目工作区：关联本地文件夹，管理任务、编辑文本，并查看 Git 提交与历史版本。"
  features_en:
    - "Import and deduplicate PDFs; read continuously with synchronised scrolling, independent zoom and annotations."
    - "Export bilingual PDFs for layout fidelity, or Word and Markdown for editing; check complex tables and formulas."
    - "Keep source-linked excerpts and ideas, use AI-assisted extraction, and convert BibTeX, RIS and CSL-JSON records."
    - "Link local project folders, manage tasks, edit text and inspect Git commits and file history."
