- name_zh: "贾维斯"
  name_en: "Jarvis"
  image_url: "/assets/media/jarvis-bilingual-reader.png"
  image_alt_zh: "贾维斯双语阅读器，左侧显示 PDF 原文，右侧显示中文译文，可同步滚动、翻页和调整缩放。"
  image_alt_en: "Jarvis bilingual reader showing the original PDF on the left and its Chinese translation on the right, with scrolling, page and zoom controls."
  section_zh: "软件开发"
  section_en: "Software Development"
  title_zh: "知识库APP：贾维斯"
  title_en: "Knowledge Base App: Jarvis"
  status_zh: "个人试用版"
  summary_zh: "面向文献阅读与管理的个人知识库。支持 PDF 原文与译文对照阅读、同步滚动和标注，也能按原文和页码保存摘录、整理引用，并导出双语 PDF、Word 或 Markdown。"
  summary_en: "A personal knowledge base for reading and organising research papers. Compare PDFs with their translations side by side, scroll both views together and add annotations. Save excerpts with page references, manage citations and export to bilingual PDF, Word or Markdown."
  status_en: "Personal prototype"
  features_zh:
    - "文献管理与双语阅读：PDF 导入去重、连续阅读、同步滚动、独立缩放与标注。"
    - "译文导出：双语 PDF 侧重保留版式，Word 与 Markdown 便于继续编辑；复杂表格和公式需核对。"
    - "知识积累与引用：按原文、页码保存摘录与观点，支持 AI 辅助提炼及 BibTeX、RIS、CSL-JSON 转换。"
    - "项目工作区：关联本地文件夹，管理任务、编辑文本，并查看 Git 提交与历史版本。"
  features_en:
    - "Import and deduplicate PDFs; read continuously with synchronised scrolling, independent zoom and annotations."
    - "Export bilingual PDFs for layout fidelity, or Word and Markdown for editing; check complex tables and formulas."
    - "Keep source-linked excerpts and ideas, use AI-assisted extraction, and convert BibTeX, RIS and CSL-JSON records."
    - "Link local project folders, manage tasks, edit text and inspect Git commits and file history."
