  title_en: "Interactive 3D Game: Aincrad"
  status_zh: "持续开发中"
  summary_zh: "以日本动画《刀剑神域》为灵感，尝试在 3D 游戏中还原艾恩格朗特的悬浮城与外围世界。目前已完成外围世界建构、游戏界面和基础战斗玩法，玩家可以步行、奔跑、跳跃和自由飞行。"
  summary_en: "Inspired by the Japanese anime Sword Art Online, this 3D game recreates Aincrad’s floating castle and surrounding world. The surrounding world, game interface and basic combat are in place. Players can walk, run, jump and fly freely."
  status_en: "In development"
  features_zh:
    - "浮岛与悬浮城：步行、奔跑、跳跃和自由飞行。"
    - "场景衔接：在城外飞行、起始之镇与浮岛之间往返。"
    - "交互体验：视角切换、镜头设置、动作与环境声效。"
  features_en:
    - "Walk, run, jump and fly freely around the island and floating castle."
    - "Travel between exterior flight, the Town of Beginnings and the island."
    - "Switch viewpoints and adjust the camera, with movement and environmental audio."
