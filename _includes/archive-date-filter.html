{% if include.dataset %}<script src="{{ base_path }}/assets/js/archive-history.js"></script>{% endif %}
<div class="archive-date-filter" data-date-filter{% if include.dataset %} data-archive-dataset="{{ include.dataset }}"{% endif %} data-language="{{ page.lang }}" data-all-label="{% if page.lang == 'zh' %}全部{% else %}All{% endif %}" data-year-label="{% if page.lang == 'zh' %}年份{% else %}Year{% endif %}" data-month-label="{% if page.lang == 'zh' %}月份{% else %}Month{% endif %}">
  <span class="archive-date-filter__label">{% if page.lang == 'zh' %}筛选归档{% else %}Filter archive{% endif %}</span>
</div>
<p class="archive-date-filter__empty" hidden>{% if page.lang == 'zh' %}没有符合当前筛选条件的记录。{% else %}No entries match the selected period.{% endif %}</p>
<script src="{{ base_path }}/assets/js/archive-date-filter.js" defer></script>
